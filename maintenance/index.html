<!doctype html>
<html lang="fr">

<title>Paranoia Studio — On revient bientôt</title>
<style>
  :root {
    --bg: #000;
    --text: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --violet: #7c3aed;
    --violet-soft: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 16px; min-height: 100vh; text-align: center;
  }
  .logo {
    width: min(260px, 60vw); height: auto;
    filter: drop-shadow(0 0 28px rgba(124, 58, 237, .7));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .name { margin-top: 16px; font-size: .95rem; font-weight: 700; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase; }
  h1 {
    margin: 40px 0 20px; max-width: 14ch;
    font-size: clamp(2.2rem, 8vw, 4.2rem); line-height: 1.02; letter-spacing: -.035em; font-weight: 600;
  }
  h1 span { color: var(--violet-soft); }
  p { margin: 0 auto 16px; max-width: 46ch; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 48px; margin-top: 16px; padding: 0 24px; border-radius: 10px;
    background: var(--text); color: #09090b; font-weight: 500; font-size: 1rem; text-decoration: none;
    transition: background-color .15s ease;
  }
  .btn:hover { background: #d4d4d8; }
  .btn:focus-visible { outline: 2px solid var(--violet-soft); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
</style>
</head>
