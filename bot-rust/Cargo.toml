[package]
name = "bot-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "macros"] }
tokio = { version = "1.53.1", features = ["full"] }
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-model = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder"] }
